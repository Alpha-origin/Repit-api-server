name: Test

# 배포(deploy.yml)는 테스트를 건너뛰고 이미지를 만든다. PR에서 DB 테스트까지 돌려 병합 전에 막는다.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 빈 DB에 Flyway가 V1부터 적용하고, ddl-auto: validate까지 같이 확인된다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: repit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d repit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 외부 서버는 부르지 않는다(테스트가 목으로 바꾼다). 값이 비면 기동이 실패해 자리만 채운다.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/repit
      DB_USERNAME: test
      DB_PASSWORD: test
      AWS_S3_ACCESS_KEY: test
      AWS_S3_SECRET_KEY: test
      S3_BUCKET: test-bucket
      S3_URL: https://test-bucket.s3.ap-northeast-2.amazonaws.com
      AWS_REGION: ap-northeast-2
      AUTH_SERVER: http://127.0.0.1:9
      AI_SERVER: http://127.0.0.1:9
      CHAT_SERVER: http://127.0.0.1:9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
