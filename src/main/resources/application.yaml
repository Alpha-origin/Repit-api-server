spring:
  application:
    name: Repit_api_server

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    aws:
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      s3:
        bucket: ${S3_BUCKET}
        base-url: ${S3_URL}
      region:
        static: ${AWS_REGION}

auth-server:
  base-url: ${AUTH_SERVER}

ai-server:
  base-url: ${AI_SERVER}

chat-server:
  base-url: ${CHAT_SERVER}

external-api:
  connect-timeout: 3s
  read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never